name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-go:
    name: Test Go Runtime
    runs-on: ubuntu-latest
    # A wedged step must fail here instead of consuming the global job budget.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: go
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go/go.sum

      - name: Download Go modules
        run: go mod download

      - name: Run Go tests
        run: go test -v -race ./...

  test-python:
    name: Test Python Runtime (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # A wedged step must fail here instead of consuming the global job budget.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: python
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[all]" pytest pytest-asyncio pytest-timeout anyio

      - name: Run Python tests
        # pytest-timeout bounds each test; this bounds the whole run, including the
        # collection phase (a module that hangs on import is outside its scope).
        run: timeout 900 pytest -v

  test-node:
    name: Test Node Runtime
    runs-on: ubuntu-latest
    # A wedged step must fail here instead of consuming the global job budget.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: node
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'
          cache-dependency-path: node/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

  test-dotnet:
    name: Test .NET Runtime
    runs-on: ubuntu-latest
    # A wedged step must fail here instead of consuming the global job budget.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: dotnet
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run .NET tests
        run: dotnet test tests/TokenSafe.Oumv.Tests/TokenSafe.Oumv.Tests.csproj -c Release --nologo

  certification:
    name: Certification is reproducible
    runs-on: ubuntu-latest
    # A wedged step must fail here instead of consuming the global job budget.
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout OUMV conformance runner
        uses: actions/checkout@v4
        with:
          repository: tokensafe-dev/oumv
          path: vendor/oumv

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'
          cache-dependency-path: node/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go/go.sum

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          coverage: none

      - name: Install Python dependencies
        working-directory: python
        run: |
          pip install --upgrade pip
          pip install -e ".[all]" pytest pytest-asyncio pytest-timeout anyio

      - name: Generate Go adapter reports
        working-directory: go
        run: |
          go mod download
          CERT_OUT_DIR="$GITHUB_WORKSPACE/cert-fresh" go test -count=1 ./pkg/adapters -run TestAdapterCertification

      - name: Generate Python adapter report
        working-directory: python
        run: CERT_OUT_DIR="$GITHUB_WORKSPACE/cert-fresh" pytest -q tests/test_conformance.py tests/test_stdio.py

      # The OUMV checkout carries sources only: its dist is gitignored, and the
      # runner the Node tests import must exist before they can certify anything.
      - name: Build OUMV conformance runner
        working-directory: vendor/oumv
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter @oumv/protocol build
          pnpm --filter @oumv/schema build
          pnpm --filter @oumv/conformance build

      - name: Install Node adapter dependencies
        working-directory: node
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build

      - name: Generate Node adapter reports
        working-directory: node
        env:
          CERT_OUT_DIR: ${{ github.workspace }}/cert-fresh
          OUMV_REPO: ${{ github.workspace }}/vendor/oumv
        run: pnpm test

      # The Elysia adapter runs on Bun, not Node: the fetch binding, the plugin and
      # the HTTP/SSE/WS certificates are exercised by `bun test` against a real
      # Bun.serve application (the same fixtures, plus the 3 transport-auth cases).
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.x'

      - name: Generate Bun/Elysia adapter reports
        working-directory: node
        env:
          CERT_OUT_DIR: ${{ github.workspace }}/cert-fresh
          OUMV_REPO: ${{ github.workspace }}/vendor/oumv
        run: bun test test-bun

      # Transport certificates boot a live application per runtime: the same
      # fixtures plus the push cases run over SSE and WebSocket, so the optional
      # bindings are proven by a report instead of by a unit test.
      - name: Generate Go transport certificates
        env:
          OUMV_REPO: ${{ github.workspace }}/vendor/oumv
          REPORT_DIR: ${{ github.workspace }}/cert-fresh/transports
        run: ./go/certify-transports.sh

      - name: Generate Python transport certificates
        env:
          OUMV_REPO: ${{ github.workspace }}/vendor/oumv
          REPORT_DIR: ${{ github.workspace }}/cert-fresh/transports
        run: ./python/certify-transports.sh

      # The Starlette binding is a second Python host for the same runtime: it
      # needs its own report at its own key, or the freshness check has a
      # committed claim with no fresh counterpart.
      - name: Generate Python (Starlette) adapter and transport reports
        env:
          OUMV_REPO: ${{ github.workspace }}/vendor/oumv
          REPORT_DIR: ${{ github.workspace }}/cert-fresh
        run: ./python/certify-starlette.sh

      # Source-level adapters: same fixtures, static route scan, no live app — the
      # L4 trace case fails by design and the report names it.
      - name: Generate Java (Spring) adapter report
        env:
          REPORT: ${{ github.workspace }}/cert-fresh/java-spring.json
          OUMV_REPO: ${{ github.workspace }}/vendor/oumv
        run: ./java/certify.sh

      - name: Generate PHP (Laravel/Symfony) adapter report
        env:
          REPORT: ${{ github.workspace }}/cert-fresh/php-laravel.json
          OUMV_REPO: ${{ github.workspace }}/vendor/oumv
        run: ./php/certify.sh

      # ASP.NET Core boots the fixture app (minimal APIs + controller + EF Core)
      # and certifies HTTP, SSE and WebSocket in one run.
      - name: Generate ASP.NET Core adapter and transport reports
        env:
          OUMV_REPO: ${{ github.workspace }}/vendor/oumv
          REPORT: ${{ github.workspace }}/cert-fresh/dotnet-aspnetcore.json
          TRANSPORT_DIR: ${{ github.workspace }}/cert-fresh/transports
        run: ./dotnet/certify.sh

      - name: Compare with committed reports
        run: python3 scripts/check_certification.py cert-fresh certification

      # A manifest claim must be a PASSED case in that adapter's own fresh report,
      # not merely a case that exists in the fixture file. Unproven claims are
      # listed with a reason in agent-oumv/scripts/claim-evidence-baseline.json.
      - name: Cross-check adapter claims against the fresh certificates
        run: >-
          node "${{ github.workspace }}/vendor/oumv/scripts/check_adapter_capabilities.mjs"
          --reports "${{ github.workspace }}/cert-fresh"
          --reports "${{ github.workspace }}/certification"

      - name: README certification block is current
        run: python3 scripts/render_certification.py --check

