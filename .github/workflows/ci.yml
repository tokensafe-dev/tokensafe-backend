name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-go:
    name: Test Go Runtime
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go/go.sum

      - name: Download Go modules
        run: go mod download

      - name: Run Go tests
        run: go test -v -race ./...

  test-python:
    name: Test Python Runtime (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[all]" pytest pytest-asyncio anyio

      - name: Run Python tests
        run: pytest -v

  test-node:
    name: Test Node Runtime
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'
          cache-dependency-path: node/pnpm-lock.yaml

      # The OUMV checkout carries sources only: its dist is gitignored, and the
      # runner the Node tests import must exist before they can certify anything.
      - name: Build OUMV conformance runner
        working-directory: vendor/oumv
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter @oumv/schema build
          pnpm --filter @oumv/conformance build

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

  certification:
    name: Certification is reproducible
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout OUMV conformance runner
        uses: actions/checkout@v4
        with:
          repository: tokensafe-dev/oumv
          path: vendor/oumv

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'
          cache-dependency-path: node/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go/go.sum

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        working-directory: python
        run: |
          pip install --upgrade pip
          pip install -e ".[all]" pytest pytest-asyncio anyio

      - name: Generate Go adapter reports
        working-directory: go
        run: |
          go mod download
          CERT_OUT_DIR="$GITHUB_WORKSPACE/cert-fresh" go test -count=1 ./pkg/adapters -run TestAdapterCertification

      - name: Generate Python adapter report
        working-directory: python
        run: CERT_OUT_DIR="$GITHUB_WORKSPACE/cert-fresh" pytest -q tests/test_conformance.py

      - name: Install Node adapter dependencies
        working-directory: node
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build

      - name: Generate Node adapter reports
        working-directory: node
        env:
          CERT_OUT_DIR: ${{ github.workspace }}/cert-fresh
          OUMV_REPO: ${{ github.workspace }}/vendor/oumv
        run: pnpm test

      - name: Compare with committed reports
        run: python3 scripts/check_certification.py cert-fresh certification

