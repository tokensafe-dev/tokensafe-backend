name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go/go.sum

      - name: Download Go modules
        working-directory: go
        run: go mod download

      - name: Run Go tests
        working-directory: go
        run: go test -v -race ./...

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Python tests
        working-directory: python
        run: |
          pip install --upgrade pip
          pip install -e ".[all]" pytest pytest-asyncio anyio
          pytest -v

      - name: Build tokensafe-python package
        working-directory: python
        run: |
          pip install --upgrade build
          python -m build

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokensafe-python-dist
          path: python/dist/

      # go/ is a nested module, so `go get .../tokensafe-backend/go` only resolves
      # against a `go/vX.Y.Z` tag — a plain `vX.Y.Z` tag is invisible to the proxy
      # (it 404s on sum.golang.org). Keep both tags in sync automatically.
      - name: Tag nested Go module
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          MOD_TAG="go/${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$MOD_TAG" >/dev/null; then
            echo "$MOD_TAG already exists"
          else
            git tag -a "$MOD_TAG" -m "Go module ${GITHUB_REF_NAME}" "$GITHUB_SHA"
            git push origin "$MOD_TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
