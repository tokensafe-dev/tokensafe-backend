name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go/go.sum

      - name: Download Go modules
        working-directory: go
        run: go mod download

      - name: Run Go tests
        working-directory: go
        run: go test -v -race ./...

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Python tests
        working-directory: python
        run: |
          pip install --upgrade pip
          pip install -e ".[all]" pytest pytest-asyncio anyio
          pytest -v

      - name: Build tokensafe-python package
        working-directory: python
        run: |
          pip install --upgrade build
          python -m build

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokensafe-python-dist
          path: python/dist/

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
          cache-dependency-path: node/pnpm-lock.yaml

      # Idempotent: a backend tag that does not touch the Node adapter must not fail
      # on an npm version that already exists.
      - name: Publish tokensafe-backend-node (only when its version is new)
        working-directory: node
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "tokensafe-backend-node@$VERSION" version >/dev/null 2>&1; then
            echo "tokensafe-backend-node@$VERSION is already published — skipping"
          else
            pnpm install --no-frozen-lockfile
            pnpm build
            pnpm publish --access public --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # go/ is a nested module, so `go get .../tokensafe-backend/go` only resolves
      # against a `go/vX.Y.Z` tag — a plain `vX.Y.Z` tag is invisible to the proxy
      # (it 404s on sum.golang.org). Keep both tags in sync automatically.
      - name: Tag nested Go module
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          MOD_TAG="go/${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$MOD_TAG" >/dev/null; then
            echo "$MOD_TAG already exists"
          else
            git tag -a "$MOD_TAG" -m "Go module ${GITHUB_REF_NAME}" "$GITHUB_SHA"
            git push origin "$MOD_TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
